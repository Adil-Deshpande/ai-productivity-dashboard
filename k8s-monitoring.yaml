apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-productivity-dashboard
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: ai-productivity-dashboard
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
