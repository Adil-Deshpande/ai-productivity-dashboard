apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ai_dashboard:cie-demo-db-password@postgres:5432/ai_productivity_dashboard?schema=public"
  JWT_SECRET: "cie-demo-secret"
  NODE_ENV: "production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-productivity-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-productivity-dashboard
  template:
    metadata:
      labels:
        app: ai-productivity-dashboard
    spec:
      containers:
        - name: ai-productivity-dashboard
          image: ai-productivity-dashboard:6
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: NODE_ENV
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ai-productivity-dashboard
spec:
  type: NodePort
  selector:
    app: ai-productivity-dashboard
  ports:
    - port: 3000
      targetPort: 3000
